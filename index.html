<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>3D Model Viewer</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
}

/* MODEL LIST */

#modelList{
    position:fixed;
    inset:0;
    z-index:10;
    padding:25px;
    overflow-y:auto;
    background:radial-gradient(circle at top,#26344d,#111827 45%,#080b10);
    color:white;
}

#modelList h1{
    text-align:center;
    margin:0 0 8px;
}

#modelList>p{
    text-align:center;
    color:#aaa;
}

/* DIRECT URL */

.url-box{
    width:min(800px,100%);
    margin:25px auto 35px;
    padding:20px;
    border-radius:16px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
}

.url-box-title{
    margin-bottom:12px;
    font-weight:bold;
}

.url-row{
    display:flex;
    gap:10px;
}

#modelUrl{
    flex:1;
    min-width:0;
    padding:13px;
    border-radius:10px;
    border:1px solid #444;
    background:#111827;
    color:white;
    outline:none;
    direction:ltr;
}

#openUrl{
    border:0;
    border-radius:10px;
    padding:0 20px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

/* CARDS */

#cards{
    width:min(1000px,100%);
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
}

.model-card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    border-radius:16px;
    padding:20px;
}

.model-name{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
    word-break:break-word;
}

.model-path{
    color:#999;
    font-size:12px;
    word-break:break-all;
    margin-bottom:18px;
}

.open-btn{
    width:100%;
    border:0;
    border-radius:10px;
    padding:12px;
    background:#2563eb;
    color:white;
    font-size:15px;
    cursor:pointer;
}

/* VIEWER */

#viewer{
    position:fixed;
    inset:0;
    display:none;
}

#backBtn,
#centerBtn{
    position:fixed;
    z-index:20;
    top:18px;
    border:0;
    border-radius:12px;
    padding:12px 18px;
    background:rgba(0,0,0,.65);
    color:white;
    cursor:pointer;
    backdrop-filter:blur(8px);
}

#backBtn{
    left:18px;
}

#centerBtn{
    right:18px;
}

/* LOADING */

#loading{
    position:fixed;
    inset:0;
    z-index:30;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(0,0,0,.9);
    color:white;
}

#loadingText{
    margin-bottom:15px;
}

#progressContainer{
    width:min(350px,80%);
    height:8px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
}

#progress{
    width:0%;
    height:100%;
    background:#2563eb;
}

#error{
    margin-top:15px;
    color:#ff7070;
    max-width:80%;
    text-align:center;
}

@media(max-width:600px){

    #modelList{
        padding:18px;
    }

    .url-row{
        flex-direction:column;
    }

    #openUrl{
        padding:12px;
    }

    #backBtn,
    #centerBtn{
        padding:10px 13px;
        font-size:13px;
    }

    #cards{
        grid-template-columns:1fr;
    }
}
</style>

<script type="importmap">
{
    "imports":{
        "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

</head>

<body>

<!-- =========================
     MODEL LIST
========================= -->

<div id="modelList">

    <h1>مدل‌های سه‌بعدی</h1>

    <p>مدل موردنظر را انتخاب کنید</p>


    <!-- DIRECT URL -->

    <div class="url-box">

        <div class="url-box-title">
            🔗 باز کردن مدل با لینک مستقیم
        </div>

        <div class="url-row">

            <input
                id="modelUrl"
                type="url"
                placeholder="https://example.com/model.glb"
            >

            <button id="openUrl">
                باز کردن مدل
            </button>

        </div>

    </div>


    <!-- GITHUB MODELS -->

    <h3 style="text-align:center;margin-bottom:20px">
        مدل‌های GitHub
    </h3>

    <div id="cards">
        در حال دریافت مدل‌ها...
    </div>

</div>


<!-- =========================
     VIEWER
========================= -->

<div id="viewer">

    <button id="backBtn">
        ← بازگشت
    </button>

    <button id="centerBtn">
        ⊙ مرکز کردن
    </button>

</div>


<!-- =========================
     LOADING
========================= -->

<div id="loading">

    <div id="loadingText">
        در حال بارگذاری مدل...
    </div>

    <div id="progressContainer">
        <div id="progress"></div>
    </div>

    <div id="error"></div>

</div>


<script type="module">

import * as THREE from "three";

import {GLTFLoader}
from "three/addons/loaders/GLTFLoader.js";

import {OrbitControls}
from "three/addons/controls/OrbitControls.js";

import {DRACOLoader}
from "three/addons/loaders/DRACOLoader.js";


/* =====================================================
   GITHUB
===================================================== */

const GITHUB_API =
"https://api.github.com/repos/xalix18/dlproj/git/trees/main?recursive=1";

const RAW_BASE =
"https://raw.githubusercontent.com/xalix18/dlproj/main/";


/* =====================================================
   DOM
===================================================== */

const modelList =
document.getElementById("modelList");

const cards =
document.getElementById("cards");

const viewer =
document.getElementById("viewer");

const loading =
document.getElementById("loading");

const loadingText =
document.getElementById("loadingText");

const progress =
document.getElementById("progress");

const errorBox =
document.getElementById("error");

const backBtn =
document.getElementById("backBtn");

const centerBtn =
document.getElementById("centerBtn");

const modelUrl =
document.getElementById("modelUrl");

const openUrl =
document.getElementById("openUrl");


/* =====================================================
   DEVICE
===================================================== */

const isMobile =
/Android|iPhone|iPad|iPod/i.test(
    navigator.userAgent
);


/* =====================================================
   THREE
===================================================== */

let scene;
let camera;
let renderer;
let controls;

let currentModel = null;

let modelRadius = 2;

let cameraTarget =
new THREE.Vector3();


/* =====================================================
   INIT
===================================================== */

function initViewer(){

    scene =
    new THREE.Scene();

    scene.background =
    new THREE.Color(0x111111);


    /* CAMERA */

    camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        .001,
        1000
    );


    camera.position.set(
        0,
        1,
        5
    );


    /* RENDERER */

    renderer =
    new THREE.WebGLRenderer({

        antialias:!isMobile,

        powerPreference:
        "high-performance"

    });


    renderer.setPixelRatio(

        isMobile
        ? Math.min(
            window.devicePixelRatio,
            1.25
        )
        : Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.outputColorSpace =
    THREE.SRGBColorSpace;


    renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure = 1;


    viewer.appendChild(
        renderer.domElement
    );


    /* LIGHTS */

    const ambient =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        2
    );

    scene.add(ambient);


    const light =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

    light.position.set(
        5,
        10,
        5
    );

    scene.add(light);


    const light2 =
    new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

    light2.position.set(
        -5,
        5,
        -5
    );

    scene.add(light2);


    /* CONTROLS */

    controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );


    controls.enableDamping =
    true;

    controls.dampingFactor =
    isMobile ? .08 : .06;

    controls.rotateSpeed =
    isMobile ? .7 : 1;

    controls.zoomSpeed =
    isMobile ? .8 : 1;

    controls.panSpeed =
    isMobile ? .7 : 1;

    controls.enablePan =
    true;

    controls.screenSpacePanning =
    true;


    controls.minDistance =
    .05;

    controls.maxDistance =
    100;


    /*
       TOUCH

       یک انگشت = چرخش
       دو انگشت = زوم + پن
    */

    controls.touches.ONE =
    THREE.TOUCH.ROTATE;

    controls.touches.TWO =
    THREE.TOUCH.DOLLY_PAN;


    controls.update();


    window.addEventListener(
        "resize",
        resize
    );


    animate();
}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    camera.aspect =
    window.innerWidth /
    window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


/* =====================================================
   ANIMATION
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );
}


/* =====================================================
   LOADING
===================================================== */

function showLoading(
    text="در حال بارگذاری مدل..."
){

    loading.style.display =
    "flex";

    loadingText.textContent =
    text;

    progress.style.width =
    "0%";

    errorBox.textContent =
    "";
}


function hideLoading(){

    loading.style.display =
    "none";
}


/* =====================================================
   LOAD GITHUB MODELS
===================================================== */

async function loadModelList(){

    try{

        const response =
        await fetch(
            GITHUB_API
        );


        if(!response.ok){

            throw new Error(
                "GitHub API Error"
            );

        }


        const data =
        await response.json();


        const files =
        data.tree.filter(
            item =>
                item.type === "blob" &&
                item.path
                .toLowerCase()
                .endsWith(".glb")
        );


        cards.innerHTML = "";


        if(!files.length){

            cards.innerHTML =
            "<p>مدلی پیدا نشد.</p>";

            return;
        }


        files.forEach(
            file =>
            createCard(
                file.path
            )
        );


    }catch(error){

        console.error(error);

        cards.innerHTML =
        `<p style="color:#ff7070">
            دریافت مدل‌های GitHub ناموفق بود.
        </p>`;

    }
}


/* =====================================================
   CARD
===================================================== */

function createCard(path){

    const card =
    document.createElement(
        "div"
    );


    card.className =
    "model-card";


    const name =
    path
    .split("/")
    .pop();


    card.innerHTML = `

        <div class="model-name">
            ${name}
        </div>

        <div class="model-path">
            ${path}
        </div>

        <button class="open-btn">
            مشاهده مدل
        </button>

    `;


    card.querySelector(
        ".open-btn"
    ).onclick = () => {

        const url =
        RAW_BASE +
        path
        .split("/")
        .map(
            x =>
            encodeURIComponent(x)
        )
        .join("/");


        openModel(url);

    };


    cards.appendChild(
        card
    );
}


/* =====================================================
   DIRECT URL
===================================================== */

openUrl.onclick =
function(){

    const url =
    modelUrl.value.trim();


    if(!url){

        alert(
            "لینک مدل را وارد کنید."
        );

        return;
    }


    /*
       فقط لینک http/https
    */

    if(
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ){

        alert(
            "لینک باید با http:// یا https:// شروع شود."
        );

        return;
    }


    openModel(url);
};


/*
   Enter
*/

modelUrl.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            openUrl.click();

        }

    }
);


/* =====================================================
   OPEN MODEL
===================================================== */

async function openModel(
    url
){

    modelList.style.display =
    "none";

    viewer.style.display =
    "block";


    showLoading(
        "در حال دریافت مدل..."
    );


    /* DELETE OLD MODEL */

    if(currentModel){

        disposeModel(
            currentModel
        );

        scene.remove(
            currentModel
        );

        currentModel =
        null;

    }


    try{

        const loader =
        new GLTFLoader();


        /* DRACO */

        const draco =
        new DRACOLoader();


        draco.setDecoderPath(
            "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
        );


        loader.setDRACOLoader(
            draco
        );


        /* LOAD */

        const gltf =
        await new Promise(
            (resolve,reject)=>{

                loader.load(

                    url,

                    resolve,

                    xhr => {

                        if(xhr.total){

                            const percent =
                            xhr.loaded /
                            xhr.total *
                            100;


                            progress.style.width =
                            percent + "%";


                            loadingText.textContent =
                            "در حال بارگذاری: " +
                            Math.round(percent) +
                            "%";

                        }else{

                            loadingText.textContent =
                            "در حال دریافت مدل...";

                        }

                    },

                    reject

                );

            }
        );


        currentModel =
        gltf.scene;


        optimizeModel(
            currentModel
        );


        scene.add(
            currentModel
        );


        frameModel(
            currentModel
        );


        hideLoading();


    }catch(error){

        console.error(
            error
        );


        loadingText.textContent =
        "بارگذاری مدل ناموفق بود";


        errorBox.innerHTML =
        `
        ممکن است لینک مستقیم اجازه CORS ندهد.
        <br><br>
        ${error.message || ""}
        `;

    }

}


/* =====================================================
   OPTIMIZE
===================================================== */

function optimizeModel(
    model
){

    model.traverse(
        object => {

            if(!object.isMesh)
                return;


            object.castShadow =
            false;

            object.receiveShadow =
            false;


            const materials =
            Array.isArray(
                object.material
            )
            ? object.material
            : [object.material];


            materials.forEach(
                material => {

                    if(!material)
                        return;


                    if(material.map){

                        material.map.anisotropy =
                        isMobile ? 1 : 4;

                        material.map.needsUpdate =
                        true;

                    }

                }
            );

        }
    );
}


/* =====================================================
   FRAME MODEL
===================================================== */

function frameModel(
    model
){

    /* ORIGINAL BOX */

    const box =
    new THREE.Box3()
    .setFromObject(model);


    const center =
    box.getCenter(
        new THREE.Vector3()
    );


    /* CENTER */

    model.position.sub(
        center
    );


    /* BOX AFTER CENTER */

    const centeredBox =
    new THREE.Box3()
    .setFromObject(model);


    const size =
    centeredBox.getSize(
        new THREE.Vector3()
    );


    const maxSize =
    Math.max(
        size.x,
        size.y,
        size.z
    );


    /* NORMALIZE */

    const scale =
    4 / maxSize;


    model.scale.setScalar(
        scale
    );


    /* FINAL BOX */

    const finalBox =
    new THREE.Box3()
    .setFromObject(model);


    const finalSize =
    finalBox.getSize(
        new THREE.Vector3()
    );


    const finalCenter =
    finalBox.getCenter(
        new THREE.Vector3()
    );


    const height =
    finalSize.y;


    const widthDepth =
    Math.max(
        finalSize.x,
        finalSize.z
    );


    /*
       تشخیص کاراکتر
    */

    const isCharacter =
    height /
    Math.max(
        widthDepth,
        .001
    ) > 1.7;


    /*
       هدف دوربین
    */

    let targetY;


    if(isCharacter){

        targetY =
        finalBox.min.y +
        height * .55;

    }else{

        targetY =
        finalCenter.y;

    }


    cameraTarget.set(
        finalCenter.x,
        targetY,
        finalCenter.z
    );


    /* SPHERE */

    const sphere =
    new THREE.Sphere();


    finalBox.getBoundingSphere(
        sphere
    );


    modelRadius =
    sphere.radius;


    /* CAMERA DISTANCE */

    const distance =
    Math.max(
        modelRadius * 2.5,
        2.5
    );


    camera.position.set(

        finalCenter.x,

        targetY +
        (isCharacter
            ? height * .08
            : modelRadius * .15),

        finalCenter.z +
        distance

    );


    controls.target.copy(
        cameraTarget
    );


    controls.minDistance =
    Math.max(
        modelRadius * .15,
        .05
    );


    controls.maxDistance =
    Math.max(
        modelRadius * 8,
        20
    );


    camera.near =
    Math.max(
        modelRadius / 1000,
        .001
    );


    camera.far =
    Math.max(
        modelRadius * 100,
        100
    );


    camera.updateProjectionMatrix();

    controls.update();
}


/* =====================================================
   CENTER BUTTON
===================================================== */

centerBtn.onclick =
function(){

    if(currentModel){

        frameModel(
            currentModel
        );

    }

};


/* =====================================================
   BACK
===================================================== */

backBtn.onclick =
function(){

    if(currentModel){

        disposeModel(
            currentModel
        );

        scene.remove(
            currentModel
        );

        currentModel =
        null;

    }


    viewer.style.display =
    "none";


    modelList.style.display =
    "block";
};


/* =====================================================
   DISPOSE
===================================================== */

function disposeModel(
    model
){

    model.traverse(
        object => {

            if(object.geometry){

                object.geometry.dispose();

            }


            if(object.material){

                const materials =
                Array.isArray(
                    object.material
                )
                ? object.material
                : [object.material];


                materials.forEach(
                    material => {

                        Object.keys(
                            material
                        ).forEach(
                            key => {

                                const value =
                                material[key];


                                if(
                                    value &&
                                    value.isTexture
                                ){

                                    value.dispose();

                                }

                            }
                        );


                        material.dispose();

                    }
                );

            }

        }
    );
}


/* =====================================================
   START
===================================================== */

initViewer();

loadModelList();

</script>

</body>
</html>

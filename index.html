<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mobile 3D Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Tahoma, sans-serif;
        }

        canvas {
            display: block;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            background: #111;
            z-index: 10;
            transition: opacity .3s;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #progress {
            width: min(300px, 80%);
            height: 6px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        #bar {
            width: 0%;
            height: 100%;
            background: #4da3ff;
            transition: width .15s;
        }

        #info {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, .45);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 5;
            pointer-events: none;
            white-space: nowrap;
        }

        #error {
            display: none;
            color: #ff7777;
            max-width: 90%;
            text-align: center;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div id="loading">

    <div id="loadingText">
        در حال آماده‌سازی مدل...
    </div>

    <div id="progress">
        <div id="bar"></div>
    </div>

    <div id="error"></div>

</div>

<div id="info">
    برای چرخاندن مدل، صفحه را بکشید 🖱️
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from 'three';

import {
    GLTFLoader
} from 'three/addons/loaders/GLTFLoader.js';

import {
    OrbitControls
} from 'three/addons/controls/OrbitControls.js';

import {
    DRACOLoader
} from 'three/addons/loaders/DRACOLoader.js';


// ======================================================
// 1. تشخیص دستگاه
// ======================================================

const isMobile =
    /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

const isLowMemory =
    navigator.deviceMemory !== undefined &&
    navigator.deviceMemory <= 4;

console.log("Mobile:", isMobile);
console.log("Device Memory:", navigator.deviceMemory);


// ======================================================
// 2. تنظیمات بر اساس دستگاه
// ======================================================

const settings = {

    pixelRatio: isMobile
        ? Math.min(window.devicePixelRatio, 1.5)
        : Math.min(window.devicePixelRatio, 2),

    antialias: !isMobile,

    maxTextureSize: isMobile
        ? 2048
        : 4096,

    shadows: !isMobile,

    exposure: isMobile
        ? 1
        : 1.1
};

console.log("Viewer settings:", settings);


// ======================================================
// 3. Scene
// ======================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x111111);


// ======================================================
// 4. Camera
// ======================================================

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.01,
    1000
);

camera.position.set(0, 2, 5);


// ======================================================
// 5. Renderer
// ======================================================

const renderer = new THREE.WebGLRenderer({

    antialias: settings.antialias,

    powerPreference: "high-performance",

    preserveDrawingBuffer: false,

    stencil: false,

    depth: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    settings.pixelRatio
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    settings.exposure;

renderer.shadowMap.enabled =
    settings.shadows;

document.body.appendChild(
    renderer.domElement
);


// ======================================================
// 6. Controls
// ======================================================

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

controls.dampingFactor = 0.06;

controls.enablePan = !isMobile;

controls.minDistance = 0.5;

controls.maxDistance = 20;

controls.target.set(
    0,
    0,
    0
);


// ======================================================
// 7. نور
// ======================================================

const ambientLight =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        isMobile ? 1.5 : 1.2
    );

scene.add(ambientLight);


const mainLight =
    new THREE.DirectionalLight(
        0xffffff,
        isMobile ? 1.5 : 2
    );

mainLight.position.set(
    5,
    10,
    7
);

scene.add(mainLight);


// ======================================================
// 8. GLTF Loader
// ======================================================

const loader = new GLTFLoader();


// ------------------------------------------------------
// Draco
// ------------------------------------------------------

const dracoLoader =
    new DRACOLoader();

dracoLoader.setDecoderPath(
    "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
);

loader.setDRACOLoader(
    dracoLoader
);


// ======================================================
// 9. محدود کردن Texture
// ======================================================

function optimizeTextures(model) {

    let textureCount = 0;

    model.traverse((object) => {

        if (!object.isMesh)
            return;

        const materials =
            Array.isArray(object.material)
                ? object.material
                : [object.material];

        materials.forEach(material => {

            if (!material)
                return;

            Object.keys(material).forEach(key => {

                const value =
                    material[key];

                if (
                    value &&
                    value.isTexture
                ) {

                    textureCount++;

                    const image =
                        value.image;

                    if (!image)
                        return;

                    const width =
                        image.width;

                    const height =
                        image.height;

                    console.log(
                        "Texture:",
                        width,
                        "x",
                        height
                    );

                    /*
                     * WebGL خودش texture را در
                     * اندازه مناسب GPU مدیریت می‌کند،
                     * ولی اینجا mipmap و filtering
                     * را برای موبایل سبک‌تر می‌کنیم.
                     */

                    if (isMobile) {

                        value.generateMipmaps =
                            false;

                        value.minFilter =
                            THREE.LinearFilter;

                        value.magFilter =
                            THREE.LinearFilter;

                        value.anisotropy = 1;
                    }
                }
            });

            material.needsUpdate = true;
        });
    });

    console.log(
        "Textures:",
        textureCount
    );
}


// ======================================================
// 10. تنظیم اندازه و مرکز مدل
// ======================================================

function prepareModel(model) {

    const box =
        new THREE.Box3()
            .setFromObject(model);

    const center =
        box.getCenter(
            new THREE.Vector3()
        );

    const size =
        box.getSize(
            new THREE.Vector3()
        );

    model.position.sub(center);


    // ------------------------------------------
    // مقیاس مناسب
    // ------------------------------------------

    const maxSize =
        Math.max(
            size.x,
            size.y,
            size.z
        );

    if (maxSize > 0) {

        const targetSize = 4;

        const scale =
            targetSize / maxSize;

        model.scale.setScalar(scale);
    }


    // ------------------------------------------
    // محاسبه مجدد
    // ------------------------------------------

    const newBox =
        new THREE.Box3()
            .setFromObject(model);

    const newCenter =
        newBox.getCenter(
            new THREE.Vector3()
        );

    model.position.sub(newCenter);


    // ------------------------------------------
    // دوربین
    // ------------------------------------------

    const finalSize =
        newBox.getSize(
            new THREE.Vector3()
        );

    const radius =
        Math.max(
            finalSize.x,
            finalSize.y,
            finalSize.z
        );

    camera.position.set(
        0,
        radius * 0.5,
        radius * 2
    );

    controls.target.set(
        0,
        0,
        0
    );

    controls.update();
}


// ======================================================
// 11. Loader
// ======================================================

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const progress =
    document.getElementById("bar");

const errorBox =
    document.getElementById("error");


loader.load(

    "./model.glb",

    function(gltf) {

        console.log(
            "GLB loaded"
        );


        loadingText.textContent =
            "در حال بهینه‌سازی مدل...";


        const model =
            gltf.scene;


        // اول optimize
        optimizeTextures(model);


        // بعد prepare
        prepareModel(model);


        // بعد وارد Scene
        scene.add(model);


        // چند frame فرصت بده
        requestAnimationFrame(() => {

            requestAnimationFrame(() => {

                loading.classList.add(
                    "hidden"
                );

            });

        });


        console.log(
            "Model ready"
        );
    },


    function(xhr) {

        if (xhr.total > 0) {

            const percent =
                (xhr.loaded / xhr.total) * 100;

            progress.style.width =
                percent.toFixed(0) + "%";

            loadingText.textContent =
                "در حال دانلود مدل " +
                percent.toFixed(0) +
                "%";

        } else {

            loadingText.textContent =
                "در حال دانلود مدل...";
        }
    },


    function(error) {

        console.error(
            "GLB ERROR:",
            error
        );

        loadingText.style.display =
            "none";

        document.getElementById(
            "progress"
        ).style.display = "none";

        errorBox.style.display =
            "block";

        errorBox.textContent =
            "مدل قابل بارگذاری نیست.";
    }

);


// ======================================================
// 12. WebGL Context Loss
// ======================================================

renderer.domElement.addEventListener(
    "webglcontextlost",
    function(event) {

        event.preventDefault();

        console.error(
            "WEBGL CONTEXT LOST"
        );

        loading.classList.remove(
            "hidden"
        );

        loadingText.textContent =
            "حافظه گرافیکی کافی نیست.";
    }
);


// ======================================================
// 13. Animation
// ======================================================

let running = true;


document.addEventListener(
    "visibilitychange",
    () => {

        running =
            !document.hidden;
    }
);


function animate() {

    requestAnimationFrame(
        animate
    );

    if (!running)
        return;

    controls.update();

    renderer.render(
        scene,
        camera
    );
}


animate();


// ======================================================
// 14. Resize
// ======================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight,
            false
        );
    }
);


// ======================================================
// 15. Cleanup هنگام خروج
// ======================================================

window.addEventListener(
    "pagehide",
    () => {

        scene.traverse(
            object => {

                if (!object.isMesh)
                    return;

                if (object.geometry) {

                    object.geometry.dispose();
                }

                const materials =
                    Array.isArray(object.material)
                        ? object.material
                        : [object.material];

                materials.forEach(
                    material => {

                        if (!material)
                            return;

                        Object.keys(material)
                            .forEach(key => {

                                const value =
                                    material[key];

                                if (
                                    value &&
                                    value.isTexture
                                ) {

                                    value.dispose();
                                }
                            });

                        material.dispose();
                    });
            }
        );

        renderer.dispose();

        dracoLoader.dispose();
    }
);

</script>

</body>
</html>

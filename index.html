<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8" />
    <title>نمایش مدل سه بعدی با Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: Tahoma, sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">برای چرخاندن مدل، ماوس را بکشید 🖱️</div>

    <!-- تنظیم آدرس ماژول‌های Three.js از CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        // ---------- 1. ساخت صحنه (Scene) ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        // ---------- 2. دوربین (Camera) ----------
        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);

        // ---------- 3. رندرر (Renderer) ----------
const renderer = new THREE.WebGLRenderer({
    antialias: false,
    powerPreference: "low-power"
});

renderer.setSize(window.innerWidth, window.innerHeight);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.5)
);

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

        // ---------- 4. کنترل چرخش با ماوس (OrbitControls) ----------
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // نرم و روان بودن حرکت
        controls.dampingFactor = 0.05;

        // ---------- 5. نورپردازی (Lights) ----------
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // برای متریال‌های PBR بهتر است از HDR Environment استفاده کنیم
        // (اختیاری - در صورت نیاز کامنت را بردارید)
        /*
        new RGBELoader()
            .load('https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr', (texture) => {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.environment = texture;
            });
        */

        // ---------- 6. لود کردن مدل GLB ----------
        const loader = new GLTFLoader();
        loader.load(
            './model.glb', // 👈 نام فایل مدل خودتون رو اینجا بذارید
            function (gltf) {
                const model = gltf.scene;

                // در صورت نیاز مدل رو در وسط قرار بدید
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.sub(center); // مدل روی مرکز صحنه قرار می‌گیره

                scene.add(model);
                console.log('مدل با موفقیت لود شد ✅');
            },
            function (xhr) {
                console.log((xhr.loaded / xhr.total * 100).toFixed(0) + '% لود شد');
            },
            function (error) {
                console.error('خطا در لود مدل ❌:', error);
            }
        );

        // ---------- 7. حلقه رندر (Animation Loop) ----------
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // ---------- 8. واکنش به تغییر سایز پنجره ----------
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

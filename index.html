<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمایش مدل سه بعدی</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        canvas { display: block; }
        #info {
            position: absolute; top: 10px; width: 100%;
            text-align: center; color: white; font-family: sans-serif;
            pointer-events: none; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">در حال لود مدل... ⏳</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js'; // برای مدل‌های فشرده

        const infoDiv = document.getElementById('info');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        // 🚨 نکته بسیار مهم برای جلوگیری از کرش گوشی:
        // پیکسل رندر را حداکثر روی 2 می‌گذاریم حتی اگر گوشی DPR = 3 داشته باشد
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // نورپردازی سبُک
        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // تنظیم لودر DRACO (برای فشرده‌سازی)
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

        const loader = new GLTFLoader();
        loader.setDRACOLoader(dracoLoader);

        // 🔗 لینک مدل خودت را اینجا بگذار
        const modelUrl = 'https://filebin.net/ovotjkd6mv2ljo3m/model.glb';

        loader.load(
            modelUrl,
            function (gltf) {
                const model = gltf.scene;
                
                // بهینه‌سازی تکسچرها در حافظه
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = false; // سایه‌ها را خاموش کردیم برای سرعت بیشتر
                        child.receiveShadow = false;
                    }
                });

                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                model.position.sub(center); 

                scene.add(model);
                
                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.z = maxDim * 1.5;
                controls.update();

                infoDiv.innerText = 'مدل با موفقیت لود شد! 🖱️📱';
            },
            function (xhr) {
                if (xhr.total > 0) {
                    infoDiv.innerText = `در حال دریافت: ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`;
                }
            },
            function (error) {
                infoDiv.innerText = 'خطا در لود! احتمالاً حجم فایل برای گوشی زیاد است.';
                console.error(error);
            }
        );

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

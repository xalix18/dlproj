<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>3D Model Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* -------------------------
           MODEL LIST
        ------------------------- */

        #modelList {
            position: fixed;
            inset: 0;
            z-index: 10;

            padding: 25px;

            overflow-y: auto;

            background:
                radial-gradient(circle at top, #26344d 0%, #111827 45%, #080b10 100%);

            color: white;
        }

        #modelList h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 28px;
        }

        #modelList p {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        #cards {
            width: min(1000px, 100%);
            margin: auto;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .model-card {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;

            backdrop-filter: blur(10px);

            transition: 0.2s;
        }

        .model-card:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.11);
        }

        .model-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .model-path {
            color: #999;
            font-size: 12px;
            word-break: break-all;
            margin-bottom: 18px;
        }

        .open-btn {
            width: 100%;
            border: none;
            border-radius: 10px;

            padding: 12px;

            background: #2563eb;
            color: white;

            font-size: 15px;
            cursor: pointer;
        }

        .open-btn:active {
            transform: scale(0.98);
        }

        /* -------------------------
           VIEWER
        ------------------------- */

        #viewer {
            position: fixed;
            inset: 0;
            display: none;
        }

        #backBtn {
            position: fixed;
            top: 18px;
            left: 18px;

            z-index: 20;

            border: none;
            border-radius: 12px;

            padding: 12px 18px;

            background: rgba(0,0,0,0.65);
            color: white;

            cursor: pointer;

            backdrop-filter: blur(8px);
        }

        #centerBtn {
            position: fixed;
            top: 18px;
            right: 18px;

            z-index: 20;

            border: none;
            border-radius: 12px;

            padding: 12px 18px;

            background: rgba(0,0,0,0.65);
            color: white;

            cursor: pointer;

            backdrop-filter: blur(8px);
        }

        /* -------------------------
           LOADING
        ------------------------- */

        #loading {
            position: fixed;
            inset: 0;

            z-index: 30;

            display: none;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            background: rgba(0,0,0,0.9);

            color: white;
        }

        #loadingText {
            margin-bottom: 15px;
            font-size: 16px;
        }

        #progressContainer {
            width: min(350px, 80%);
            height: 8px;

            background: #333;
            border-radius: 20px;

            overflow: hidden;
        }

        #progress {
            width: 0%;
            height: 100%;

            background: #2563eb;

            transition: width 0.15s;
        }

        #error {
            margin-top: 15px;
            color: #ff7070;
            max-width: 80%;
            text-align: center;
        }

        /* -------------------------
           MOBILE
        ------------------------- */

        @media (max-width: 600px) {

            #modelList {
                padding: 18px;
            }

            #modelList h1 {
                font-size: 23px;
            }

            #cards {
                grid-template-columns: 1fr;
            }

            #backBtn,
            #centerBtn {
                padding: 10px 13px;
                font-size: 13px;
            }
        }
    </style>


    <!-- THREE.JS -->

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

</head>

<body>

<!-- =========================
     MODEL LIST
========================= -->

<div id="modelList">

    <h1>مدل‌های سه‌بعدی</h1>

    <p>
        یک مدل را برای مشاهده انتخاب کنید
    </p>

    <div id="cards">
        در حال دریافت مدل‌ها...
    </div>

</div>


<!-- =========================
     VIEWER
========================= -->

<div id="viewer">

    <button id="backBtn">
        ← بازگشت
    </button>

    <button id="centerBtn">
        ⊙ مرکز کردن
    </button>

</div>


<!-- =========================
     LOADING
========================= -->

<div id="loading">

    <div id="loadingText">
        در حال بارگذاری مدل...
    </div>

    <div id="progressContainer">
        <div id="progress"></div>
    </div>

    <div id="error"></div>

</div>


<script type="module">

import * as THREE from "three";

import { GLTFLoader }
    from "three/addons/loaders/GLTFLoader.js";

import { OrbitControls }
    from "three/addons/controls/OrbitControls.js";

import { DRACOLoader }
    from "three/addons/loaders/DRACOLoader.js";


/* =====================================================
   CONFIG
===================================================== */

const GITHUB_API =
    "https://api.github.com/repos/xalix18/dlproj/git/trees/main?recursive=1";

const RAW_BASE =
    "https://raw.githubusercontent.com/xalix18/dlproj/main/";


/* =====================================================
   DOM
===================================================== */

const modelList =
    document.getElementById("modelList");

const cards =
    document.getElementById("cards");

const viewer =
    document.getElementById("viewer");

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const progress =
    document.getElementById("progress");

const errorBox =
    document.getElementById("error");

const backBtn =
    document.getElementById("backBtn");

const centerBtn =
    document.getElementById("centerBtn");


/* =====================================================
   DEVICE
===================================================== */

const isMobile =
    /Android|iPhone|iPad|iPod/i.test(
        navigator.userAgent
    );


/* =====================================================
   THREE VARIABLES
===================================================== */

let scene;
let camera;
let renderer;
let controls;

let currentModel = null;

let modelRadius = 2;

let cameraTarget =
    new THREE.Vector3(0, 0, 0);


/* =====================================================
   INITIALIZE VIEWER
===================================================== */

function initViewer() {

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x111111);


    /* -------------------------
       CAMERA
    ------------------------- */

    camera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
            window.innerHeight,
            0.01,
            1000
        );

    camera.position.set(
        0,
        1,
        5
    );


    /* -------------------------
       RENDERER
    ------------------------- */

    renderer =
        new THREE.WebGLRenderer({

            antialias: !isMobile,

            alpha: false,

            powerPreference:
                "high-performance"
        });


    renderer.setPixelRatio(

        isMobile
            ? Math.min(window.devicePixelRatio, 1.25)
            : Math.min(window.devicePixelRatio, 2)

    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
        1;


    viewer.appendChild(
        renderer.domElement
    );


    /* =================================================
       LIGHTS
    ================================================= */

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2
        );

    scene.add(ambient);


    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    directional.position.set(
        5,
        10,
        5
    );

    scene.add(directional);


    const directional2 =
        new THREE.DirectionalLight(
            0xffffff,
            1.5
        );

    directional2.position.set(
        -5,
        5,
        -5
    );

    scene.add(directional2);


    /* =================================================
       CONTROLS
    ================================================= */

    controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );


    controls.enableDamping = true;


    controls.dampingFactor =
        isMobile
            ? 0.08
            : 0.06;


    /*
       سرعت چرخش
    */

    controls.rotateSpeed =
        isMobile
            ? 0.7
            : 1;


    /*
       سرعت زوم
    */

    controls.zoomSpeed =
        isMobile
            ? 0.8
            : 1;


    /*
       حرکت مدل روی صفحه
    */

    controls.panSpeed =
        isMobile
            ? 0.7
            : 1;


    /*
       پن با مختصات صفحه
    */

    controls.screenSpacePanning =
        true;


    controls.enablePan =
        true;


    /*
       فاصله زوم
    */

    controls.minDistance =
        0.05;

    controls.maxDistance =
        100;


    /*
       حالت لمس موبایل

       یک انگشت:
       چرخش

       دو انگشت:
       زوم + حرکت
    */

    controls.touches.ONE =
        THREE.TOUCH.ROTATE;

    controls.touches.TWO =
        THREE.TOUCH.DOLLY_PAN;


    controls.target.set(
        0,
        0,
        0
    );


    controls.update();


    /* =================================================
       RESIZE
    ================================================= */

    window.addEventListener(
        "resize",
        onResize
    );


    /* =================================================
       WEBGL CONTEXT LOST
    ================================================= */

    renderer.domElement.addEventListener(
        "webglcontextlost",
        function(event) {

            event.preventDefault();

            console.warn(
                "WebGL context lost"
            );
        }
    );


    animate();
}


/* =====================================================
   RESIZE
===================================================== */

function onResize() {

    if (!camera || !renderer)
        return;


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


/* =====================================================
   ANIMATION
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (controls) {

        controls.update();

    }


    if (renderer && scene && camera) {

        renderer.render(
            scene,
            camera
        );

    }
}


/* =====================================================
   LOADING UI
===================================================== */

function showLoading(
    text = "در حال بارگذاری مدل..."
) {

    loading.style.display =
        "flex";

    loadingText.textContent =
        text;

    progress.style.width =
        "0%";

    errorBox.textContent =
        "";
}


function hideLoading() {

    loading.style.display =
        "none";
}


/* =====================================================
   GET GLB FILES FROM GITHUB
===================================================== */

async function loadModelList() {

    try {

        const response =
            await fetch(
                GITHUB_API
            );


        if (!response.ok) {

            throw new Error(
                "GitHub API error: " +
                response.status
            );

        }


        const data =
            await response.json();


        const glbFiles =
            data.tree.filter(
                item =>
                    item.type === "blob" &&
                    item.path
                        .toLowerCase()
                        .endsWith(".glb")
            );


        if (glbFiles.length === 0) {

            cards.innerHTML =
                "<p>هیچ فایل GLB پیدا نشد.</p>";

            return;
        }


        cards.innerHTML =
            "";


        glbFiles.forEach(
            file => {

                createModelCard(
                    file.path
                );

            }
        );


    } catch (error) {

        console.error(error);

        cards.innerHTML = `
            <p style="color:#ff7070">
                دریافت لیست مدل‌ها انجام نشد.
                <br>
                ${error.message}
            </p>
        `;

    }
}


/* =====================================================
   CREATE MODEL CARD
===================================================== */

function createModelCard(
    path
) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "model-card";


    const fileName =
        path
            .split("/")
            .pop();


    card.innerHTML = `

        <div class="model-name">
            ${fileName}
        </div>

        <div class="model-path">
            ${path}
        </div>

        <button class="open-btn">
            مشاهده مدل
        </button>

    `;


    const button =
        card.querySelector(
            ".open-btn"
        );


    button.addEventListener(
        "click",
        () => {

            openModel(path);

        }
    );


    cards.appendChild(
        card
    );
}


/* =====================================================
   OPEN MODEL
===================================================== */

async function openModel(
    path
) {

    modelList.style.display =
        "none";


    viewer.style.display =
        "block";


    showLoading(
        "در حال بارگذاری " +
        path.split("/").pop()
    );


    /*
       اگر مدل قبلی وجود دارد
       حذفش می‌کنیم
    */

    if (currentModel) {

        disposeModel(
            currentModel
        );

        scene.remove(
            currentModel
        );

        currentModel = null;
    }


    /*
       URL مدل
    */

    const url =
        RAW_BASE +
        path
            .split("/")
            .map(
                part =>
                    encodeURIComponent(part)
            )
            .join("/");


    try {

        const loader =
            new GLTFLoader();


        /* -------------------------
           DRACO
        ------------------------- */

        const dracoLoader =
            new DRACOLoader();


        dracoLoader.setDecoderPath(
            "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
        );


        loader.setDRACOLoader(
            dracoLoader
        );


        /* -------------------------
           LOAD
        ------------------------- */

        const gltf =
            await new Promise(
                (resolve, reject) => {

                    loader.load(

                        url,

                        resolve,

                        xhr => {

                            if (
                                xhr.total
                            ) {

                                const percent =
                                    (
                                        xhr.loaded /
                                        xhr.total
                                    ) * 100;


                                progress.style.width =
                                    percent + "%";


                                loadingText.textContent =
                                    "در حال بارگذاری: " +
                                    Math.round(percent) +
                                    "%";

                            } else {

                                loadingText.textContent =
                                    "در حال دریافت مدل...";

                            }

                        },

                        reject

                    );

                }
            );


        currentModel =
            gltf.scene;


        /*
           بهینه‌سازی متریال‌ها
        */

        optimizeModel(
            currentModel
        );


        /*
           قرار دادن مدل
           و تنظیم دوربین
        */

        frameModel(
            currentModel
        );


        scene.add(
            currentModel
        );


        hideLoading();


    } catch (error) {

        console.error(
            error
        );


        errorBox.textContent =
            "خطا در بارگذاری مدل";


        loadingText.textContent =
            "بارگذاری ناموفق بود";


        console.error(
            "Model URL:",
            url
        );

    }

}


/* =====================================================
   OPTIMIZE MODEL
===================================================== */

function optimizeModel(
    model
) {

    model.traverse(
        object => {

            if (!object.isMesh)
                return;


            /*
               Shadows را خاموش می‌کنیم
               چون روی موبایل سنگین هستند
            */

            object.castShadow =
                false;

            object.receiveShadow =
                false;


            const materials =
                Array.isArray(
                    object.material
                )
                    ? object.material
                    : [object.material];


            materials.forEach(
                material => {

                    if (!material)
                        return;


                    /*
                       anisotropy کمتر روی موبایل
                    */

                    if (
                        material.map
                    ) {

                        material.map.anisotropy =
                            isMobile
                                ? 1
                                : Math.min(
                                    renderer.capabilities
                                        .getMaxAnisotropy(),
                                    4
                                );


                        material.map.needsUpdate =
                            true;

                    }


                    /*
                       Texture های دیگر
                    */

                    if (
                        material.normalMap
                    ) {

                        material.normalMap.anisotropy =
                            1;

                    }


                    if (
                        material.roughnessMap
                    ) {

                        material.roughnessMap.anisotropy =
                            1;

                    }


                    if (
                        material.metalnessMap
                    ) {

                        material.metalnessMap.anisotropy =
                            1;

                    }

                }

            );

        }
    );
}


/* =====================================================
   FRAME MODEL
===================================================== */

function frameModel(
    model
) {

    /*
       ابتدا scale اصلی را به دست می‌آوریم
    */

    const box =
        new THREE.Box3()
            .setFromObject(model);


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    /*
       مدل را در مرکز قرار می‌دهیم
    */

    model.position.x -=
        center.x;

    model.position.y -=
        center.y;

    model.position.z -=
        center.z;


    /*
       دوباره bounding box
    */

    const newBox =
        new THREE.Box3()
            .setFromObject(model);


    const newSize =
        newBox.getSize(
            new THREE.Vector3()
        );


    /*
       بزرگ‌ترین بعد مدل
    */

    const maxSize =
        Math.max(
            newSize.x,
            newSize.y,
            newSize.z
        );


    /*
       مدل را به اندازه مناسب
       normalize می‌کنیم
    */

    const desiredSize =
        4;


    const scale =
        desiredSize /
        maxSize;


    model.scale.setScalar(
        scale
    );


    /*
       bounding box بعد از scale
    */

    const finalBox =
        new THREE.Box3()
            .setFromObject(model);


    const finalSize =
        finalBox.getSize(
            new THREE.Vector3()
        );


    const finalCenter =
        finalBox.getCenter(
            new THREE.Vector3()
        );


    /*
       ارتفاع مدل
    */

    const height =
        finalSize.y;


    /*
       تشخیص تقریبی شخصیت

       اگر ارتفاع خیلی بیشتر
       از عرض باشد، احتمالاً
       مدل یک انسان / کاراکتر است.
    */

    const widthDepth =
        Math.max(
            finalSize.x,
            finalSize.z
        );


    const characterRatio =
        height /
        Math.max(widthDepth, 0.001);


    const isCharacter =
        characterRatio > 1.7;


    /*
       هدف دوربین
    */

    let targetY;


    if (isCharacter) {

        /*
           برای شخصیت:
           حدود 55٪ ارتفاع
           یعنی اطراف سینه/صورت
        */

        targetY =
            finalBox.min.y +
            height * 0.55;

    } else {

        /*
           برای مدل‌های معمولی:
           مرکز مدل
        */

        targetY =
            finalCenter.y;

    }


    cameraTarget.set(
        finalCenter.x,
        targetY,
        finalCenter.z
    );


    /*
       شعاع مدل
    */

    const sphere =
        new THREE.Sphere();


    finalBox.getBoundingSphere(
        sphere
    );


    modelRadius =
        sphere.radius;


    /*
       فاصله مناسب دوربین
    */

    const distance =
        Math.max(
            modelRadius * 2.4,
            2.5
        );


    /*
       دوربین را کمی مورب
       قرار می‌دهیم
    */

    camera.position.set(

        finalCenter.x,

        targetY +

        (isCharacter
            ? height * 0.08
            : modelRadius * 0.15),

        finalCenter.z +
        distance

    );


    /*
       هدف OrbitControls
    */

    controls.target.copy(
        cameraTarget
    );


    /*
       محدودیت زوم بر اساس مدل
    */

    controls.minDistance =
        Math.max(
            modelRadius * 0.15,
            0.05
        );


    controls.maxDistance =
        Math.max(
            modelRadius * 8,
            20
        );


    camera.near =
        Math.max(
            modelRadius / 1000,
            0.001
        );


    camera.far =
        Math.max(
            modelRadius * 100,
            100
        );


    camera.updateProjectionMatrix();


    controls.update();


    /*
       مدل را کمی بهتر داخل صفحه
       قرار می‌دهیم
    */

    fitCameraToModel(
        model,
        1.15
    );
}


/* =====================================================
   FIT CAMERA
===================================================== */

function fitCameraToModel(
    model,
    offset = 1.2
) {

    const box =
        new THREE.Box3()
            .setFromObject(model);


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    const maxDim =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    const fov =
        camera.fov *
        Math.PI /
        180;


    let distance =
        Math.abs(
            maxDim /
            2 /
            Math.tan(fov / 2)
        );


    distance *=
        offset;


    /*
       جهت فعلی دوربین
    */

    const direction =
        new THREE.Vector3();


    direction
        .subVectors(
            camera.position,
            controls.target
        )
        .normalize();


    /*
       اگر جهت معتبر نبود
    */

    if (
        !isFinite(direction.x) ||
        !isFinite(direction.y) ||
        !isFinite(direction.z)
    ) {

        direction.set(
            0,
            0,
            1
        );

    }


    camera.position.copy(
        controls.target
    );


    camera.position.add(
        direction.multiplyScalar(
            distance
        )
    );


    camera.lookAt(
        controls.target
    );


    controls.update();
}


/* =====================================================
   CENTER CAMERA BUTTON
===================================================== */

centerBtn.addEventListener(
    "click",
    () => {

        if (!currentModel)
            return;


        frameModel(
            currentModel
        );

    }
);


/* =====================================================
   BACK BUTTON
===================================================== */

backBtn.addEventListener(
    "click",
    () => {

        /*
           مدل را پاک کن
        */

        if (currentModel) {

            disposeModel(
                currentModel
            );

            scene.remove(
                currentModel
            );

            currentModel =
                null;

        }


        viewer.style.display =
            "none";


        modelList.style.display =
            "block";

    }
);


/* =====================================================
   DISPOSE MODEL
===================================================== */

function disposeModel(
    model
) {

    model.traverse(
        object => {

            if (
                object.geometry
            ) {

                object.geometry.dispose();

            }


            if (
                object.material
            ) {

                const materials =
                    Array.isArray(
                        object.material
                    )
                        ? object.material
                        : [object.material];


                materials.forEach(
                    material => {

                        if (!material)
                            return;


                        /*
                           Texture ها
                        */

                        Object.keys(
                            material
                        ).forEach(
                            key => {

                                const value =
                                    material[key];


                                if (
                                    value &&
                                    value.isTexture
                                ) {

                                    value.dispose();

                                }

                            }
                        );


                        material.dispose();

                    }
                );

            }

        }
    );
}


/* =====================================================
   START
===================================================== */

initViewer();

loadModelList();


/* =====================================================
   PAGE HIDE
===================================================== */

window.addEventListener(
    "pagehide",
    () => {

        if (currentModel) {

            disposeModel(
                currentModel
            );

        }

    }
);

</script>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Model Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Tahoma, sans-serif;
            background: #111;
        }

        canvas {
            display: block;
        }

        /* ==============================
           Model Selector
        ============================== */

        #modelSelector {
            position: fixed;
            inset: 0;
            z-index: 20;

            background:
                radial-gradient(
                    circle at top,
                    #263238,
                    #111 65%
                );

            color: white;

            overflow-y: auto;

            padding: 40px 20px;
        }

        .selector-container {
            width: min(900px, 100%);
            margin: auto;
        }

        .title {
            text-align: center;
            margin-bottom: 35px;
        }

        .title h1 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        .title p {
            margin: 0;
            color: #aaa;
        }

        #models {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 18px;
        }

        .model-card {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 20px;

            transition:
                transform .2s,
                border-color .2s;

            cursor: pointer;
        }

        .model-card:hover {
            transform: translateY(-4px);
            border-color: #4da3ff;
        }

        .model-icon {
            width: 60px;
            height: 60px;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #263238;

            font-size: 28px;

            margin-bottom: 15px;
        }

        .model-name {
            font-size: 18px;
            font-weight: bold;

            direction: ltr;
            text-align: left;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .model-path {
            color: #777;
            font-size: 12px;

            direction: ltr;
            text-align: left;

            margin-top: 7px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .open-button {
            width: 100%;
            margin-top: 18px;

            padding: 12px;

            border: 0;
            border-radius: 10px;

            background: #1976d2;
            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        .open-button:hover {
            background: #2196f3;
        }

        #status {
            text-align: center;
            color: #aaa;
            margin: 30px 0;
        }

        /* ==============================
           Viewer
        ============================== */

        #viewer {
            position: fixed;
            inset: 0;
            display: none;
            background: #111;
        }

        #viewer.active {
            display: block;
        }

        #backButton {
            position: fixed;
            top: 15px;
            right: 15px;

            z-index: 10;

            border: 0;
            border-radius: 10px;

            background: rgba(0, 0, 0, .65);
            color: white;

            padding: 11px 16px;

            cursor: pointer;

            font-family: Tahoma;
        }

        #modelInfo {
            position: fixed;
            top: 15px;
            left: 15px;

            z-index: 10;

            color: white;

            background: rgba(0, 0, 0, .55);

            padding: 8px 14px;

            border-radius: 20px;

            direction: ltr;
        }

        #loading {
            position: fixed;
            inset: 0;

            z-index: 30;

            display: none;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            background: #111;

            color: white;
        }

        #loading.active {
            display: flex;
        }

        #progress {
            width: min(300px, 80%);
            height: 6px;

            background: #333;

            border-radius: 10px;

            overflow: hidden;

            margin-top: 15px;
        }

        #bar {
            width: 0%;
            height: 100%;

            background: #2196f3;

            transition: width .15s;
        }

        #error {
            color: #ff7777;
            margin-top: 20px;
            max-width: 90%;
            text-align: center;
        }

        @media (max-width: 600px) {

            #modelSelector {
                padding: 25px 15px;
            }

            .title h1 {
                font-size: 25px;
            }

            #models {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<!-- ==========================================
     انتخاب مدل
========================================== -->

<div id="modelSelector">

    <div class="selector-container">

        <div class="title">

            <h1>مدل‌های سه‌بعدی</h1>

            <p>
                یک مدل را برای نمایش انتخاب کنید
            </p>

        </div>

        <div id="status">
            در حال دریافت مدل‌ها از GitHub...
        </div>

        <div id="models"></div>

    </div>

</div>


<!-- ==========================================
     Viewer
========================================== -->

<div id="viewer">

    <button id="backButton">
        ← بازگشت
    </button>

    <div id="modelInfo"></div>

</div>


<!-- ==========================================
     Loading
========================================== -->

<div id="loading">

    <div id="loadingText">
        در حال آماده‌سازی مدل...
    </div>

    <div id="progress">
        <div id="bar"></div>
    </div>

    <div id="error"></div>

</div>


<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from 'three';

import {
    GLTFLoader
} from 'three/addons/loaders/GLTFLoader.js';

import {
    OrbitControls
} from 'three/addons/controls/OrbitControls.js';

import {
    DRACOLoader
} from 'three/addons/loaders/DRACOLoader.js';


// ==================================================
// GitHub Settings
// ==================================================

const OWNER = "xalix18";

const REPO = "dlproj";

const BRANCH = "main";


// GitHub API
const API_URL =
    `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;


// Raw GitHub
const RAW_URL =
    `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;


// ==================================================
// DOM
// ==================================================

const modelSelector =
    document.getElementById("modelSelector");

const modelsContainer =
    document.getElementById("models");

const status =
    document.getElementById("status");

const viewer =
    document.getElementById("viewer");

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const progress =
    document.getElementById("bar");

const errorBox =
    document.getElementById("error");

const backButton =
    document.getElementById("backButton");

const modelInfo =
    document.getElementById("modelInfo");


// ==================================================
// Device
// ==================================================

const isMobile =
    /Android|iPhone|iPad|iPod/i.test(
        navigator.userAgent
    );


// ==================================================
// Three.js
// ==================================================

let scene;
let camera;
let renderer;
let controls;

let currentModel = null;


// ==================================================
// GitHub Models
// ==================================================

async function loadModels() {

    try {

        const response =
            await fetch(API_URL);

        if (!response.ok) {

            throw new Error(
                "GitHub API Error: " +
                response.status
            );
        }

        const data =
            await response.json();


        const files =
            data.tree.filter(
                item =>
                    item.type === "blob" &&
                    item.path
                        .toLowerCase()
                        .endsWith(".glb")
            );


        console.log(
            "GLB files:",
            files
        );


        if (files.length === 0) {

            status.textContent =
                "هیچ فایل GLB پیدا نشد.";

            return;
        }


        status.textContent =
            `${files.length} مدل پیدا شد`;


        files.forEach(
            file => {

                createModelCard(
                    file
                );
            }
        );

    }
    catch (error) {

        console.error(error);

        status.textContent =
            "خطا در دریافت فایل‌های GitHub";

    }

}


// ==================================================
// Create Model Card
// ==================================================

function createModelCard(file) {

    const card =
        document.createElement("div");

    card.className =
        "model-card";


    const icon =
        document.createElement("div");

    icon.className =
        "model-icon";

    icon.textContent =
        "🧊";


    const name =
        document.createElement("div");

    name.className =
        "model-name";

    name.textContent =
        file.path
            .split("/")
            .pop();


    const path =
        document.createElement("div");

    path.className =
        "model-path";

    path.textContent =
        file.path;


    const button =
        document.createElement("button");

    button.className =
        "open-button";

    button.textContent =
        "باز کردن مدل";


    button.addEventListener(
        "click",
        () => {

            openModel(
                file.path
            );

        }
    );


    card.appendChild(icon);

    card.appendChild(name);

    card.appendChild(path);

    card.appendChild(button);


    modelsContainer.appendChild(
        card
    );
}


// ==================================================
// Initialize Three
// ==================================================

function initThree() {

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x111111);


    camera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
            window.innerHeight,
            0.01,
            1000
        );


    camera.position.set(
        0,
        2,
        5
    );


    renderer =
        new THREE.WebGLRenderer({

            antialias: !isMobile,

            powerPreference:
                "high-performance",

            preserveDrawingBuffer:
                false,

            stencil: false

        });


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.setPixelRatio(

        isMobile

            ? Math.min(
                window.devicePixelRatio,
                1.5
            )

            : Math.min(
                window.devicePixelRatio,
                2
            )
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
        1;


    viewer.appendChild(
        renderer.domElement
    );


    // ----------------------------------------------
    // Controls
    // ----------------------------------------------

    controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );


    controls.enableDamping =
        true;

    controls.dampingFactor =
        0.06;

    controls.enablePan =
        !isMobile;


    // ----------------------------------------------
    // Lights
    // ----------------------------------------------

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            1.5
        );

    scene.add(
        ambient
    );


    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );

    directional.position.set(
        5,
        10,
        7
    );

    scene.add(
        directional
    );


    animate();
}


// ==================================================
// Open Model
// ==================================================

function openModel(path) {

    modelSelector.style.display =
        "none";

    viewer.classList.add(
        "active"
    );

    loading.classList.add(
        "active"
    );


    loadingText.textContent =
        "در حال دانلود مدل...";

    progress.style.width =
        "0%";

    errorBox.textContent =
        "";


    modelInfo.textContent =
        path;


    if (!renderer) {

        initThree();

    }


    // مدل قبلی
    if (currentModel) {

        disposeModel(
            currentModel
        );

        scene.remove(
            currentModel
        );

        currentModel = null;
    }


    const loader =
        new GLTFLoader();


    // Draco
    const draco =
        new DRACOLoader();

    draco.setDecoderPath(
        "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
    );

    loader.setDRACOLoader(
        draco
    );


    const url =
        RAW_URL +
        path
            .split("/")
            .map(
                encodeURIComponent
            )
            .join("/");


    console.log(
        "Loading:",
        url
    );


    loader.load(

        url,

        gltf => {

            currentModel =
                gltf.scene;


            optimizeModel(
                currentModel
            );


            centerModel(
                currentModel
            );


            scene.add(
                currentModel
            );


            loading.classList.remove(
                "active"
            );


            draco.dispose();

        },


        xhr => {

            if (xhr.total > 0) {

                const percent =
                    xhr.loaded /
                    xhr.total *
                    100;

                progress.style.width =
                    percent + "%";

                loadingText.textContent =
                    "در حال دانلود مدل " +
                    Math.round(percent) +
                    "%";

            }

        },


        error => {

            console.error(
                error
            );

            loadingText.textContent =
                "خطا در بارگذاری مدل";

            errorBox.textContent =
                "فایل مدل قابل بارگذاری نیست.";

            draco.dispose();
        }
    );
}


// ==================================================
// Optimize
// ==================================================

function optimizeModel(
    model
) {

    model.traverse(
        object => {

            if (!object.isMesh)
                return;


            object.frustumCulled =
                true;


            const materials =
                Array.isArray(
                    object.material
                )
                    ? object.material
                    : [
                        object.material
                    ];


            materials.forEach(
                material => {

                    if (!material)
                        return;


                    Object.keys(
                        material
                    ).forEach(
                        key => {

                            const value =
                                material[key];


                            if (
                                value &&
                                value.isTexture
                            ) {

                                if (
                                    isMobile
                                ) {

                                    value.anisotropy =
                                        1;

                                    value.generateMipmaps =
                                        false;

                                    value.minFilter =
                                        THREE.LinearFilter;
                                }

                            }

                        }
                    );


                    material.needsUpdate =
                        true;

                }
            );

        }
    );
}


// ==================================================
// Center Model
// ==================================================

function centerModel(
    model
) {

    const box =
        new THREE.Box3()
            .setFromObject(
                model
            );


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    model.position.sub(
        center
    );


    const maxSize =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    if (maxSize > 0) {

        const scale =
            4 / maxSize;

        model.scale.setScalar(
            scale
        );

    }


    controls.target.set(
        0,
        0,
        0
    );

    controls.update();


    camera.position.set(
        0,
        2,
        5
    );
}


// ==================================================
// Dispose
// ==================================================

function disposeModel(
    model
) {

    model.traverse(
        object => {

            if (
                object.geometry
            ) {

                object.geometry.dispose();
            }


            if (
                object.material
            ) {

                const materials =
                    Array.isArray(
                        object.material
                    )
                        ? object.material
                        : [
                            object.material
                        ];


                materials.forEach(
                    material => {

                        Object.keys(
                            material
                        ).forEach(
                            key => {

                                const value =
                                    material[key];


                                if (
                                    value &&
                                    value.isTexture
                                ) {

                                    value.dispose();
                                }

                            }
                        );


                        material.dispose();

                    }
                );

            }

        }
    );
}


// ==================================================
// Back
// ==================================================

backButton.addEventListener(
    "click",
    () => {

        if (currentModel) {

            disposeModel(
                currentModel
            );

            scene.remove(
                currentModel
            );

            currentModel =
                null;
        }


        viewer.classList.remove(
            "active"
        );


        modelSelector.style.display =
            "block";

    }
);


// ==================================================
// Render
// ==================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    if (controls) {

        controls.update();
    }


    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );
    }

}


// ==================================================
// Resize
// ==================================================

window.addEventListener(
    "resize",
    () => {

        if (!camera ||
            !renderer)
            return;


        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight,
            false
        );

    }
);


// ==================================================
// Start
// ==================================================

loadModels();

</script>

</body>
</html>
